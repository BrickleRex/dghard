[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dghard"
version = "0.1.0"
description = "Post-hoc repair of catastrophic forgetting via Donoho-Gavish hard threshold on the fine-tune delta."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Anonymous" }]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "safetensors>=0.4",
  "numpy>=1.24",
  "tqdm>=4.66",
  "datasets>=2.18",
  "requests>=2.32",
]

[project.optional-dependencies]
gpu = ["vllm>=0.6"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
dghard = "dghard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dghard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: integration test that downloads a small (~270 MB) HuggingFace model",
]
addopts = "-ra --strict-markers -m 'not slow'"
